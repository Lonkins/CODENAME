name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build, test, lint (arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain info
        run: |
          uname -m
          swift --version
      - name: Build
        run: swift build --package-path Packages/CODENAMEKit
      - name: Test
        run: |
          swift build --package-path Packages/CODENAMEKit --product TestCore
          BIN="$(swift build --package-path Packages/CODENAMEKit --show-bin-path)"
          # Serial: session suites share TestCore's statics and the
          # process-global session slot; cross-suite parallelism corrupts both.
          TEST_CORE_PATH="$BIN/libTestCore.dylib" swift test --package-path Packages/CODENAMEKit \
            --no-parallel
      - name: Test (thread sanitizer)
        run: |
          BIN="$(swift build --package-path Packages/CODENAMEKit --show-bin-path --sanitize=thread)"
          TEST_CORE_PATH="$BIN/libTestCore.dylib" swift test --package-path Packages/CODENAMEKit \
            --sanitize=thread --no-parallel --skip XPCLoopbackTests --skip XPCSessionParityTests \
            --skip HelperSessionTests
      - name: Lint
        run: swift format lint --strict --recursive Packages
      - name: Assemble app bundle (ad-hoc signed)
        run: ./Scripts/make-app.sh
      - name: Assert the release bundle ships nothing developmental
        run: |
          APP=build/CODENAME.app
          # Swift keeps string literals of 15 bytes or fewer as immediates,
          # so only the longer hook names are greppable — enough to fail
          # loudly if the #if DEBUG fence around them is ever removed.
          for hook in CODENAME_OPEN_CONTENT CODENAME_XPC_SMOKE CODENAME_FULLSCREEN_TEST \
            CODENAME_AUTOSTOP_SECONDS CODENAME_FORCE_HELPER; do
            if strings -a "$APP/Contents/MacOS/CODENAME" | grep -q "$hook"; then
              echo "error: release binary contains development hook $hook" >&2
              exit 1
            fi
          done
          if [ -e "$APP/Contents/PlugIns/libTestCore.dylib" ]; then
            echo "error: release bundle ships the test core" >&2
            exit 1
          fi

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: CODENAME-app-adhoc
          path: build/CODENAME.app
