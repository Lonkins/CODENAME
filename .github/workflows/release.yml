name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  release:
    name: Sign, notarize, package
    runs-on: macos-latest
    env:
      HAVE_SIGNING: ${{ secrets.MACOS_CERT_P12_BASE64 != '' }}
      HAVE_SPARKLE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Import Developer ID certificate
        if: env.HAVE_SIGNING == 'true'
        env:
          P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 1800 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          rm "$RUNNER_TEMP/cert.p12"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk -F'"' '/Developer ID Application/ {print $2; exit}')"
          [ -n "$IDENTITY" ] || { echo "no Developer ID Application identity found" >&2; exit 1; }
          echo "CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Configure notarization key
        if: env.HAVE_SIGNING == 'true'
        env:
          ASC_P8: ${{ secrets.ASC_PRIVATE_KEY_P8 }}
        run: |
          printf '%s' "$ASC_P8" > "$RUNNER_TEMP/asc_key.p8"
          {
            echo "ASC_KEY_PATH=$RUNNER_TEMP/asc_key.p8"
            echo "ASC_KEY_ID=${{ secrets.ASC_KEY_ID }}"
            echo "ASC_ISSUER_ID=${{ secrets.ASC_ISSUER_ID }}"
          } >> "$GITHUB_ENV"

      - name: Build release artifact
        run: |
          VERSION="${GITHUB_REF_NAME#v}" BUILD="${{ github.run_number }}" ./Scripts/make-release.sh

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "$HAVE_SIGNING" = "true" ]; then
            gh release create "$GITHUB_REF_NAME" \
              "build/CODENAME-$VERSION.dmg" "build/CODENAME-$VERSION.dmg.sha256" \
              --title "CODENAME $VERSION" --generate-notes
          else
            gh release create "$GITHUB_REF_NAME" \
              "build/CODENAME-$VERSION.dmg" "build/CODENAME-$VERSION.dmg.sha256" \
              --prerelease --title "CODENAME $VERSION (unsigned dry run)" \
              --notes "Dry-run build produced without signing secrets. Ad-hoc signed, not notarized, will not pass Gatekeeper. For pipeline verification only."
          fi

      - name: Generate appcast
        if: env.HAVE_SPARKLE_KEY == 'true'
        env:
          SPARKLE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          printf '%s' "$SPARKLE_KEY" > "$RUNNER_TEMP/sparkle_ed_key"
          VERSION="${GITHUB_REF_NAME#v}" BUILD="${{ github.run_number }}" \
            SPARKLE_ED_PRIVATE_KEY_FILE="$RUNNER_TEMP/sparkle_ed_key" ./Scripts/make-appcast.sh
          rm "$RUNNER_TEMP/sparkle_ed_key"

      - name: Upload Pages artifact
        if: env.HAVE_SPARKLE_KEY == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

      - name: Delete keychain
        if: always() && env.HAVE_SIGNING == 'true'
        run: security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true

  publish-appcast:
    name: Publish appcast to Pages
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
